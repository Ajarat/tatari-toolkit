<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Stratari: community tools for Clash of Critters players. Coming soon." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stratari</title>
    <style>
      :root {
        --bg: #0f1115;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --accent: #7c5cff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f7fb;
          --fg: #111827;
          --muted: #6b7280;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 2.25rem;
        letter-spacing: -0.02em;
      }
      .soon {
        margin: 0 0 16px;
        color: var(--accent);
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Stratari</h1>
      <p class="soon">Coming soon</p>
      <p>Community tools for Clash of Critters players, starting with an evolution calendar that lines up your Tatari with the events they need.</p>
      <footer>Unofficial Fan-Created Work. Not made, endorsed or authorized by Farlight Games.</footer>
    </main>
  </body>
</html>
